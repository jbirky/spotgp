name: Draft PDF

# Build the JOSS paper (paper/paper.md) with the Open Journals renderer whenever
# the paper or this workflow changes. The PDF is attached to the run as an artifact.
on:
  push:
    paths:
      - paper/**
      - .github/workflows/draft-pdf.yml
  workflow_dispatch:

jobs:
  paper:
    runs-on: ubuntu-latest
    name: Paper Draft
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build draft PDF
        uses: openjournals/openjournals-draft-action@master
        with:
          journal: joss
          # Path to the paper within the repo
          paper-path: paper/paper.md

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: paper
          # The PDF is written next to the input paper.md
          path: paper/paper.pdf
          archive: false
