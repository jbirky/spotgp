[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spotgp"
version = "1.3.0"
description = "Gaussian Process kernels for stellar variability from starspot models"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Jessica Birky"},
]
dependencies = [
    "numpy>=2.0",
    "scipy",
    "matplotlib",
    "jax",
    "astropy",
    "h5py",
]

[project.optional-dependencies]
jaxopt = ["jaxopt"]
pgm = ["daft-pgm"]
# Bandpass-integrated synthetic photometry for the spectral contrast model
spectral = ["pyphot"]
# Full model-atmosphere spectral contrast via Korg.jl (1D LTE synthesis)
korg = ["pyphot", "juliacall", "juliapkg"]
# All optional features in one shot: pip install "spotgp[extras]"
# (korg already includes the spectral extra's pyphot dependency)
extras = ["spotgp[jaxopt,pgm,korg]"]
docs = [
    "sphinx>=7.0",
    "sphinx-book-theme>=1.0",
    "sphinx-copybutton>=0.5",
    "myst-nb>=1.0",
    "sphinxcontrib-mermaid>=0.9",
    "pygments-styles>=0.3",
]

[tool.setuptools.packages.find]
include = ["spotgp*"]
